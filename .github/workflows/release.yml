name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # to attach the builds to a release on tag pushes

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/rust-image-studio.exe dist/RustImageStudio.exe
          Copy-Item README.md, README.ko.md, LICENSE, THIRD_PARTY_NOTICES.md dist/
          # The embedded Nanum Gothic font's license, at the path THIRD_PARTY_NOTICES links to.
          New-Item -ItemType Directory dist/assets/fonts | Out-Null
          Copy-Item assets/fonts/OFL.txt dist/assets/fonts/
          # The menu guide the READMEs link to, at the same relative path.
          New-Item -ItemType Directory dist/docs | Out-Null
          Copy-Item docs/GUIDE.md, docs/GUIDE.ko.md dist/docs/
          Compress-Archive -Path dist/* -DestinationPath RustImageStudio-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RustImageStudio-windows-x64
          path: RustImageStudio-windows-x64.zip

  linux:
    # 22.04 (glibc 2.35), the same floor as the Linux engine (linux-engine.yml), so the app
    # also starts on distributions older than the newest runner.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # A release must not ship the placeholder engine URL: Linux users' first run would
      # fail with HTTP 404. Set the repository in `linux_engine_release!` (src/config.rs).
      - name: Engine URL is set
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if grep -q 'github.com/OWNER/REPO/' src/config.rs; then
            echo "::error file=src/config.rs::linux_engine_release! still points at OWNER/REPO. Set the real GitHub repository before tagging a release."
            exit 1
          fi

      # No apt packages needed to build or test: winit/wgpu load X11, Wayland, xkbcommon,
      # Vulkan and GL at run time (dlopen), arboard talks to X11/Wayland in pure Rust and rfd
      # uses the XDG desktop portal over D-Bus (no GTK). Checked on a clean Ubuntu 24.04.
      # Users need the run-time libraries listed in the README's Linux section.

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir -p dist/RustImageStudio
          cp target/release/rust-image-studio dist/RustImageStudio/RustImageStudio
          chmod +x dist/RustImageStudio/RustImageStudio
          cp README.md README.ko.md LICENSE THIRD_PARTY_NOTICES.md dist/RustImageStudio/
          # The embedded Nanum Gothic font's license, at the path THIRD_PARTY_NOTICES links to.
          mkdir -p dist/RustImageStudio/assets/fonts
          cp assets/fonts/OFL.txt dist/RustImageStudio/assets/fonts/
          # The menu guide the READMEs link to, at the same relative path.
          mkdir -p dist/RustImageStudio/docs
          cp docs/GUIDE.md docs/GUIDE.ko.md dist/RustImageStudio/docs/
          tar -C dist -czf RustImageStudio-linux-x64.tar.gz RustImageStudio

      - uses: actions/upload-artifact@v4
        with:
          name: RustImageStudio-linux-x64
          path: RustImageStudio-linux-x64.tar.gz

  # One job publishes the release with both builds, after both succeeded. Two jobs creating
  # the same tag's release at once can race (one fails with "already exists"), and a failed
  # build would otherwise leave a release with only the other platform.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RustImageStudio-windows-x64.zip
            dist/RustImageStudio-linux-x64.tar.gz
          # Shown above the generated notes: first-time users meet SmartScreen on the unsigned exe.
          body: |
            **Windows:** extract the zip and run `RustImageStudio.exe`. If a blue "Windows protected your PC" window appears, click **More info → Run anyway**. The exe is not code-signed yet, so each new version starts without download history at Microsoft; it is not a virus detection. These files are built from this repository's source by the release workflow. [Details](https://github.com/hid276/rust-image-studio#first-run-security-warning)
          generate_release_notes: true
