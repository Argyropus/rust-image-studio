[package]
name = "rust-image-studio"
version = "1.0.1"
edition = "2024"
description = "Local Qwen-Image-2.1 Turbo image generation app for Windows and Linux (egui + stable-diffusion.cpp)"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
base64 = "0.23.1"
chrono = "0.4.45"
crc32fast = "1.5.4"
eframe = { version = "0.37", features = ["persistence"] }
egui = "0.37"
egui_extras = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
open = "5.4.5"
rand = "0.10.3"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
trash = "5.3.0"
ureq = { version = "3", features = ["json"] }
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
# The Linux engine/captioner archives are .tar.gz.
flate2 = "1"
tar = { version = "0.4", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_JobObjects", "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# egui 0.37 no longer bundles its emoji fonts by default. Windows finds Segoe UI Emoji
# through the system font fallback; a Linux system often has no emoji font at all, so the
# button icons (✨ 📂 🔍 🖼 🎲 …) would show as boxes. Bundled there only, so Windows keeps
# its color emoji.
[target.'cfg(not(windows))'.dependencies]
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
